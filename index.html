<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/vite.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script type="module" src="/src/main.js" defer></script>
		<title>calculator</title>
	</head>
	<body>
		<div class="container">
            <p class="name">SUPER EXTRA BARTKOWY KALKULATOR</p>
			<div class="display">0</div>
			<div class="buttons">
				<div class="btnFirstRow">
					<button>1</button>
					<button>2</button>
					<button>3</button>
					<button>+</button>
                </div>
				<div class="btnSecondRow">
					<button>4</button>
					<button>5</button>
					<button>6</button>
					<button>-</button>
				</div>
				<div class="btnThirdRow">
					<button>7</button>
					<button>8</button>
					<button>9</button>
					<button>/</button>
				</div>
				<div class="btnRest">
					<button>0</button>
					<button>C</button>
					<button>=</button>
					<button>*</button>
				</div>
			</div>
		</div>
	</body>
</html>
